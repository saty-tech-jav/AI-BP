spring.application.name=bp-tracker

# MySQL Database - Values come from Railway environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration - comes from Railway environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Server Port - Railway injects PORT automatically
server.port=${PORT:8080}

# Logging
logging.level.com.bptracker=INFO
